# Searches Reddit on a schedule and saves new buyer posts to Supabase.
# It uses lead_capture/apify_source.py and posts nothing to Reddit.

name: Search Reddit for buyer posts

on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours (UTC). Each run uses Apify credit, so start slow.
  workflow_dispatch: {}         # lets you press "Run workflow" by hand to test

concurrency:
  group: reddit-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lead_capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install apify-client supabase python-dotenv requests numpy scikit-learn anthropic
          fi
      - name: Search and save
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID:fatihtahta/reddit-scraper-search-fast
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python apify_source.py
